# template-admin 独立 workspace 配置
# 使其脱离根 monorepo 的 pnpm-workspace.yaml，成为可独立 pnpm install 的分发包。
allowBuilds:
  esbuild: true
  vue-demi: true
  "@parcel/watcher": true
  core-js: true
  node-pty: true

shellEmulator: true

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

packages:
  - "."

minimumReleaseAgeExclude:
  - '@raopan/easy-ui@1.1.3'
  - vite-svg-loader@5.1.2
