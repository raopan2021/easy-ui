# 构建并部署 EasyUI 文档站到 GitHub Pages
#
# 前提：仓库 Settings → Pages → Source 选择 "GitHub Actions"
# 部署路径：https://<user>.github.io/easy-ui/（vite.config.ts 依据 GH_PAGES 设置 base）
#
# 同时构建 template-admin 管理后台，合并部署到 /easy-ui/admin/ 子路径，并上传 artifact 供下载
#
name: Deploy EasyUI site to Pages

on:
  # 在针对 `main` 分支的推送上运行
  push:
    branches: [main]

  # 允许从 Actions 选项卡手动运行
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许同时进行一次部署，跳过正在运行与最新队列之间的运行
# 不取消正在进行的运行，允许生产部署完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 构建工作 ──
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 保留完整历史，便于 lastUpdated / 版本信息
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11 # 与本地 pnpm 一致，确保 lockfileVersion 9.0 兼容
          run_install: false # 由下方 Install 步骤统一安装，避免重复
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm # 缓存 pnpm store，加速安装
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile # 严格按 pnpm-lock.yaml 安装

      ########## ------------ 构建 packages/easy-ui，打包为 lib 包 ------------ ##########
      - name: Build @raopan/easy-ui lib
        # template-admin 通过 file:../packages/easy-ui 引用 easy-ui，构建前需先产出 dist。
        # 注意：根 package.json 的 build:lib 会自动执行 template-admin install（本地开发便利），
        # CI 中为避免与下方显式的 frozen install 重复/冲突，此处仅构建不触发自动 install。
        run: pnpm --filter @raopan/easy-ui build

      - name: Install template-admin dependencies
        # template-admin 是独立 workspace（拥有独立 pnpm-lock.yaml），需单独安装
        run: pnpm --dir template-admin install --frozen-lockfile

      ########## ------------ 构建 doc 文档 ------------ ##########
      - name: Build with EasyUI
        env:
          # 文档站部署在 GitHub Pages 子路径 /easy-ui/ 下，vite.config.ts 据此设置 base
          GH_PAGES: "true"
          # 后台模板入口地址（HeaderLayout 的 VITE_ADMIN_URL），指向合并部署的 admin 子路径
          VITE_ADMIN_URL: "https://raopan2021.github.io/easy-ui/admin/"
        run: pnpm build

      ########## ------------ 构建 template-admin 包 ------------ ##########
      - name: Build template-admin
        env:
          # 覆盖 .env 中的 /admin/，使产物适配 GitHub Pages 子路径 /easy-ui/admin/
          # （vite loadEnv 中 process.env 优先于 .env 文件）
          VITE_PUBLIC_PATH: "/easy-ui/admin/"
          # hash 模式：GitHub Pages 无 SPA fallback 且多 SPA 无法用 404.html 分发，
          # hash 路由刷新只请求根路径，深层路由不 404
          VITE_ROUTER_HISTORY: "hash,/easy-ui/admin/"
        run: pnpm build:admin

      ########## ------------ 合并构建产物，处理深层路由、404问题  ------------ ##########
      - name: Merge template-admin into site
        # 合并 admin 产物到 docs/dist/admin，一次部署同时上线 docs + admin
        # GitHub Pages 无 SPA fallback：为 docs 与 admin 各复制 index.html 为 404.html，
        # 深层路由 / 不存在路径会回退到应用入口，由 vue-router 渲染内置 404 页面
        run: |
          cp docs/dist/index.html docs/dist/404.html
          mkdir -p docs/dist/admin
          cp -r template-admin/dist/admin/. docs/dist/admin/
          cp docs/dist/admin/index.html docs/dist/admin/404.html

      ########## ------------ 推送  ------------ ##########
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist
      - name: Upload template-admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-admin-dist
          path: template-admin/dist/admin
          if-no-files-found: error

  # ── 部署工作 ──
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
